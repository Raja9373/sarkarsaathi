<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SarkarSaathi - Government Schemes, Opportunities & Public Services</title>
    <meta name="description" content="Independent information platform for verified government schemes, startup grants, research fellowships, and public opportunities." />
    <script>
      (function() {
        try {
          var pathname = window.location.pathname;
          var cleanPath = pathname.replace(/^\/+|\/+$/g, '');
          var canonicalUrl = 'https://sarkarsaathi.org' + (cleanPath ? '/' + cleanPath : '/');
          var link = document.querySelector('link[rel="canonical"]');
          if (!link) {
            link = document.createElement('link');
            link.setAttribute('rel', 'canonical');
            document.head.appendChild(link);
          }
          link.setAttribute('href', canonicalUrl);
        } catch (e) {}
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SarkarSaathi" />
    <meta property="og:title" content="SarkarSaathi - Government Schemes, Opportunities & Public Services" />
    <meta property="og:description" content="Independent information platform for verified government schemes, startup grants, research fellowships, and public opportunities." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SarkarSaathi - Government Schemes, Opportunities & Public Services" />
    <meta name="twitter:description" content="Independent information platform for verified government schemes, startup grants, research fellowships, and public opportunities." />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return originalFetch; },
            set: function(fn) { originalFetch = fn; }
          });
        } catch (e) {}
      })();
    </script>
  </head>
