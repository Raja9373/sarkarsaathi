name: Automatic Source Update Check

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 2:00 AM UTC
  workflow_dispatch:

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run Source Update Check
        env:
          NODE_ENV: production
        run: |
          echo "Starting official source update check workflow..."
          npm run check-sources
          npm run build
          echo "Source update check completed safely with auto-publish disabled."
