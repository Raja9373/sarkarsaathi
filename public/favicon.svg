<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="40%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  {/* Outer App Badge */}
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)" />

  {/* Inner Decorative Accent Ring */}
  <circle cx="256" cy="256" r="176" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6" stroke-dasharray="12 8" />

  {/* Central Shield of Trust */}
  <path d="M 256 96 L 384 152 V 272 C 384 352 312 408 256 432 C 200 408 128 352 128 272 V 152 Z" fill="url(#goldGrad)" filter="url(#shadow)" opacity="0.95" />
  <path d="M 256 112 L 368 162 V 268 C 368 338 304 388 256 410 C 208 388 144 338 144 268 V 162 Z" fill="#0f172a" />

  {/* Bold Letter 'S' for SarkarSaathi */}
  <path d="M 292 208 C 292 188 272 176 244 176 C 216 176 200 188 200 208 C 200 228 220 238 252 248 C 292 260 312 276 312 308 C 312 338 284 356 244 356 C 204 356 176 338 176 312" fill="none" stroke="url(#goldGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

  {/* Checkmark Accent (Verified Badge) inside top right */}
  <circle cx="368" cy="160" r="48" fill="#1e3a8a" stroke="url(#goldGrad)" stroke-width="8" />
  <path d="M 348 160 L 362 174 L 392 144" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  {/* Tricolor Indicator Bar at Bottom */}
  <g transform="translate(144, 436)">
    <rect x="0" y="0" width="74" height="12" rx="6" fill="url(#saffronGrad)" />
    <rect x="83" y="0" width="74" height="12" rx="6" fill="#ffffff" />
    <rect x="166" y="0" width="74" height="12" rx="6" fill="url(#greenGrad)" />
  </g>
</svg>
