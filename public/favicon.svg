<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  {/* Outer Badge */}
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#dropShadow)" />
  
  {/* Inner Dotted Ring */}
  <circle cx="50" cy="50" r="42" fill="none" stroke="#60a5fa" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" />

  {/* Government Dome / Parliament Silhouette & Pillars */}
  <g fill="#ffffff" filter="url(#dropShadow)">
    {/* Central Dome */}
    <path d="M 42 34 C 42 27, 58 27, 58 34 Z" fill="url(#goldGrad)" />
    <path d="M 40 35 L 60 35 L 62 38 L 38 38 Z" fill="url(#goldGrad)" />
    
    {/* Pillars */}
    <rect x="29" y="40" width="5" height="24" rx="1" />
    <rect x="38" y="40" width="5" height="24" rx="1" />
    <rect x="47.5" y="40" width="5" height="24" rx="1" />
    <rect x="57" y="40" width="5" height="24" rx="1" />
    <rect x="66" y="40" width="5" height="24" rx="1" />

    {/* Base Steps */}
    <rect x="24" y="66" width="52" height="4" rx="1.5" fill="#f8fafc" />
    <rect x="20" y="72" width="60" height="4.5" rx="1.5" fill="url(#goldGrad)" />
  </g>

  {/* Tricolor Ribbon at bottom */}
  <g>
    <path d="M 22 83 C 34 89, 66 89, 78 83" fill="none" stroke="#ff9933" stroke-width="3" stroke-linecap="round" />
    <path d="M 23 87 C 34 92, 66 92, 77 87" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <path d="M 24 91 C 34 95, 66 95, 76 91" fill="none" stroke="#138808" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
