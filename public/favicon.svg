<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ssNavBg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#071238" />
      <stop offset="55%" stop-color="#0d2366" />
      <stop offset="100%" stop-color="#193b9e" />
    </linearGradient>
    <linearGradient id="ssGoldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#f5c342" />
      <stop offset="100%" stop-color="#d49617" />
    </linearGradient>
    <linearGradient id="ssWhiteBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="ssDepth" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#02081e" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Commercial Squircle Base -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#ssNavBg)" />

  <!-- Interlocking Gold & White Ribbon Double-S Mark -->
  <g filter="url(#ssDepth)">
    <!-- Upper Brushed Gold Ribbon -->
    <path
      d="M 362 128 L 210 128 C 172 128 148 152 148 188 C 148 228 184 246 226 262 C 242 268 250 276 256 284 C 258 248 242 224 214 206 C 198 196 196 180 212 180 L 314 180 L 314 212 Z"
      fill="url(#ssGoldTop)"
    />

    <!-- Lower Crisp White Ribbon -->
    <path
      d="M 150 348 L 302 348 C 340 348 364 324 364 288 C 364 248 328 230 286 214 C 270 208 262 200 256 192 C 254 228 270 252 298 270 C 314 280 316 296 300 296 L 198 296 L 198 264 Z"
      fill="url(#ssWhiteBot)"
    />
  </g>

  <!-- Indian Tricolor Precision Pill Accent -->
  <g transform="translate(148, 382)">
    <rect x="0" y="0" width="72" height="22" rx="11" fill="#FF9933" />
    <rect x="72" y="0" width="72" height="22" fill="#FFFFFF" />
    <rect x="144" y="0" width="72" height="22" rx="11" fill="#16A34A" />
    <rect x="64" y="0" width="16" height="22" fill="#FF9933" />
    <rect x="72" y="0" width="72" height="22" fill="#FFFFFF" />
    <rect x="136" y="0" width="16" height="22" fill="#16A34A" />
  </g>
</svg>
